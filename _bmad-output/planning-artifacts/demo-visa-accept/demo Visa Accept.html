<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visa Accept Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: danh sách kịch bản bên trái · sân khấu điện thoại ở giữa · thanh dẫn chuyện bên dưới
   Luồng màn hình theo mục 2 "Visa Accept" trong tài liệu Visa "VDS – Acquiring discussion" (10/2026) */
:root{
  --red:#E1062C; --red-soft:#FDECEF;
  --ink:#1B1517; --muted:#6C6064; --line:#E9E3E5; --bg:#FFFFFF; --surface:#F7F4F5;
  --font:"Be Vietnam Pro","Segoe UI",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  /* Màn hình điện thoại luôn sáng như app thật */
  --p-bg:#FFFFFF; --p-soft:#F3F4F7; --p-ink:#1B1517; --p-muted:#6B6670; --p-line:#E6E3E8;
  --tendoo:#E1062C; --visa:#1434CB; --visa-soft:#EEF1FD; --ok:#138A4E; --warn:#B45309; --device:#17121A;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --red:#FF4D68; --red-soft:#3A1219; --ink:#F4EFF1; --muted:#AA9DA2; --line:#352B2F; --bg:#141012; --surface:#1D181A; --device:#3B3238; color-scheme:dark; }
}
:root[data-theme="dark"]{ --red:#FF4D68; --red-soft:#3A1219; --ink:#F4EFF1; --muted:#AA9DA2; --line:#352B2F; --bg:#141012; --surface:#1D181A; --device:#3B3238; color-scheme:dark; }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); font-size:15px; line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px))}
button{font:inherit}
:focus-visible{outline:2px solid var(--red); outline-offset:2px}
.label{font-family:var(--mono); font-size:.7rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}

.app{max-width:1360px; margin:0 auto; display:grid; grid-template-columns:270px minmax(0,1fr); gap:32px; padding-block:24px}
.side{position:sticky; top:16px; align-self:start; display:flex; flex-direction:column; gap:18px}
.brand{display:flex; flex-direction:column; gap:2px}
.brand b{font-size:1.15rem; font-weight:800}
.brand b em{font-style:normal; color:var(--red)}
.note{font-size:.78rem; color:var(--muted); line-height:1.45}
.grp{display:flex; flex-direction:column; gap:6px}
.sc{all:unset; cursor:pointer; display:flex; flex-direction:column; gap:3px; padding:10px 12px; border-radius:10px; border:1px solid transparent}
.sc:hover{background:var(--surface)}
.sc[aria-current="true"]{background:var(--surface); border-color:var(--line)}
.sc[aria-current="true"] .sct{color:var(--red)}
.sc:focus-visible{outline:2px solid var(--red)}
.sct{font-weight:700; font-size:.92rem; line-height:1.3}
.scp{font-size:.78rem; color:var(--muted); line-height:1.35}

main{min-width:0; display:flex; flex-direction:column; gap:20px}
.head{display:flex; flex-direction:column; gap:6px}
.head h1{margin:0; font-size:1.6rem; font-weight:800; line-height:1.2; text-wrap:balance}
.head p{margin:0; color:var(--muted); max-width:72ch}

.stage{display:flex; justify-content:center; align-items:flex-start; gap:40px; flex-wrap:wrap; padding:8px 0}
.dev{display:flex; flex-direction:column; align-items:center; gap:10px}
.dev>.label{text-align:center}
.phone{width:300px; height:610px; border-radius:42px; background:var(--device); padding:11px; box-shadow:0 18px 40px rgba(0,0,0,.18)}
.scr{position:relative; width:100%; height:100%; border-radius:32px; overflow:hidden; background:var(--p-bg); color:var(--p-ink);
  display:flex; flex-direction:column; font-size:13px; line-height:1.45}
.sb{display:flex; justify-content:space-between; align-items:center; padding:10px 22px 4px; font-size:11px; font-weight:600}
.sb .cam{width:12px; height:12px; border-radius:50%; background:#111}
.scr.blue{background:var(--visa); color:#fff}
.scr.blue .sb{color:#fff}
.bar-t{display:flex; align-items:center; gap:8px; padding:8px 16px 10px; border-bottom:1px solid var(--p-line)}
.blue .bar-t{border-color:transparent}
.bar-t b{flex:1; text-align:center; font-size:14px}
.bar-t i{font-style:normal; width:18px; color:var(--p-muted)}
.blue .bar-t i{color:#fff}
.tdh{background:var(--tendoo); color:#fff; padding:6px 16px 14px}
.tdh small{opacity:.85}
.tdh b{display:block; font-size:16px}
.body{flex:1; overflow:hidden; padding:14px 16px; display:flex; flex-direction:column; gap:10px}
.foot{padding:12px 16px 18px; display:flex; flex-direction:column; gap:8px}
.mu{color:var(--p-muted); font-size:12px}
.blue .mu{color:#DCE3FF}
.big{font-size:28px; font-weight:800; letter-spacing:-.01em}
.h{font-size:17px; font-weight:800; line-height:1.3}
.pc{border:1px solid var(--p-line); border-radius:14px; padding:12px; display:flex; flex-direction:column; gap:6px; background:var(--p-bg)}
.pc.soft{background:var(--p-soft); border-color:transparent}
.r{display:flex; justify-content:space-between; gap:10px}
.r.tot{font-weight:800; border-top:1px dashed var(--p-line); padding-top:6px}
.prog{height:6px; border-radius:3px; background:var(--p-line); overflow:hidden}
.prog i{display:block; height:100%; background:var(--visa)}
.prog.warn i{background:var(--warn)}
.pb{display:block; text-align:center; padding:11px 14px; border-radius:24px; background:var(--visa); color:#fff; font-weight:700; cursor:default}
.pb.red{background:var(--tendoo)}
.pb.ghost{background:transparent; color:var(--visa); border:1px solid var(--visa)}
.pb.white{background:#fff; color:var(--visa)}
.pb.outw{background:transparent; color:#fff; border:1px solid #fff}
.pb.danger{background:#D64545}
.pb.sm{display:inline-block; padding:6px 14px; font-size:12px}
.pb.dark{background:#111; border-radius:6px}
[data-next]{cursor:pointer; animation:hot 1.4s ease-in-out infinite}
@keyframes hot{0%,100%{box-shadow:0 0 0 0 rgba(225,6,44,.55)}50%{box-shadow:0 0 0 7px rgba(225,6,44,0)}}
@media (prefers-reduced-motion: reduce){[data-next]{animation:none; outline:3px solid rgba(225,6,44,.7)}}
.chip{display:inline-block; font-size:11px; font-weight:700; padding:2px 8px; border-radius:10px; background:#E6F4EC; color:var(--ok)}
.chip.w{background:#FEF3E2; color:var(--warn)}
.chip.v{background:var(--visa-soft); color:var(--visa)}
.inp{border:1.5px solid var(--visa); border-radius:8px; padding:9px 10px; font-weight:600}
.inp.g{border-color:var(--p-line); font-weight:400; color:var(--p-muted)}
.lab{font-size:11px; color:var(--visa); font-weight:600}
.opt{display:flex; align-items:center; gap:10px; border:1px solid var(--p-line); border-radius:10px; padding:11px 12px}
.opt.on{border-color:var(--visa); background:var(--visa-soft)}
.rad{width:16px; height:16px; border-radius:50%; border:2px solid var(--p-muted); flex:none}
.on .rad{border:5px solid var(--visa)}
.vw{font-weight:900; font-style:italic; color:var(--visa); letter-spacing:.02em}
.blue .vw{color:#fff}
.tabs{display:flex; background:var(--p-soft); border-radius:8px; padding:3px}
.tabs span{flex:1; text-align:center; padding:6px; border-radius:6px; font-size:12px; color:var(--p-muted)}
.tabs .on{background:var(--visa); color:#fff; font-weight:700}
.grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; text-align:center; font-size:10.5px}
.grid div{display:flex; flex-direction:column; align-items:center; gap:4px}
.grid em{font-style:normal; width:38px; height:38px; border-radius:12px; background:var(--red-soft); color:var(--tendoo); display:grid; place-items:center; font-weight:800; font-size:13px}
.grid .new em{background:var(--visa); color:#fff}
.banner{border-radius:14px; padding:14px; background:linear-gradient(135deg,var(--visa),#3156E8); color:#fff; display:flex; flex-direction:column; gap:6px}
.banner ul{margin:0; padding-left:16px; font-size:11.5px}
.center{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:10px}
.ring{width:96px; height:96px; border-radius:50%; border:2px solid rgba(255,255,255,.7); display:grid; place-items:center}
.ring svg{width:52px}
.ok-ic{width:44px; height:44px; border-radius:50%; background:#fff; color:var(--visa); display:grid; place-items:center; font-size:24px; font-weight:900}
.ok-ic.g{background:#E6F4EC; color:var(--ok)}
.rcpt .mu{color:var(--p-muted)}
.rcpt{background:#fff; color:var(--p-ink); border-radius:14px; padding:14px; width:100%; display:flex; flex-direction:column; gap:6px; text-align:left}
.qr{width:150px; height:150px; background:#fff; border-radius:12px; padding:10px}
.sms{align-self:flex-start; max-width:85%; background:var(--p-soft); border-radius:16px 16px 16px 4px; padding:10px 12px; font-size:12.5px}
.sms a{color:var(--visa); text-decoration:underline}
.step3{display:flex; flex-direction:column; gap:8px}
.st{display:flex; align-items:center; gap:8px; font-weight:700}
.st i{font-style:normal; width:20px; height:20px; border-radius:50%; border:1.5px solid var(--p-ink); display:grid; place-items:center; font-size:11px}
.st.done i{background:var(--ok); border-color:var(--ok); color:#fff}
.st.dim{color:var(--p-muted); font-weight:500}
.st.dim i{border-color:var(--p-muted)}
.tx{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--p-line)}
.tx:last-child{border-bottom:0}
.tx b{font-size:13px}
.tx .neg{color:#D64545}
.toast{position:absolute; left:12px; right:12px; top:34px; background:#fff; color:var(--p-ink); border-radius:14px; padding:10px 12px; box-shadow:0 8px 24px rgba(0,0,0,.18); display:flex; gap:10px; align-items:center; font-size:12px}
.toast em{font-style:normal; width:30px; height:30px; border-radius:8px; background:var(--tendoo); color:#fff; display:grid; place-items:center; font-weight:800}
.tier{display:flex; gap:10px; align-items:stretch}
.tier>i{width:4px; border-radius:2px; background:var(--p-line); flex:none}
.tier.on>i{background:var(--visa)}
.tier div{display:flex; flex-direction:column; gap:2px}
.ov{position:absolute; inset:0; background:rgba(0,0,0,.4); display:flex; align-items:flex-end}
.sheet{background:#fff; color:var(--p-ink); width:100%; border-radius:20px 20px 0 0; padding:18px 16px 22px; display:flex; flex-direction:column; gap:10px}

/* Thẻ Visa của khách */
.vcard{width:280px; height:176px; border-radius:16px; padding:18px; color:#fff; background:linear-gradient(135deg,#1A1F71,#2D4BD8 70%,#5B7BFF);
  box-shadow:0 14px 30px rgba(20,52,203,.35); display:flex; flex-direction:column; justify-content:space-between; transition:transform .5s ease}
.vcard .chipc{width:38px; height:28px; border-radius:6px; background:linear-gradient(135deg,#E8C66A,#B8913A)}
.vcard .num{font-family:var(--mono); letter-spacing:.12em; font-size:15px}
.vcard .r{align-items:flex-end; font-size:12px}
.vcard .vw{color:#fff; font-size:24px}
.vcard.tapped{transform:translateX(-30px) rotate(-4deg)}
.vcard-wrap{height:610px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px}
.vcard-wrap .hint2{font-size:.85rem; color:var(--muted); text-align:center; max-width:260px}

.nar{border:1px solid var(--line); border-radius:16px; padding:16px 18px; display:flex; flex-direction:column; gap:10px; background:var(--surface)}
.nar-top{display:flex; align-items:center; gap:12px}
.bar{flex:1; height:4px; border-radius:2px; background:var(--line); overflow:hidden}
.bar i{display:block; height:100%; background:var(--red); transition:width .3s}
#say{margin:0; font-size:1.02rem; min-height:3.1em; max-width:90ch}
.ctl{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.cb{border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:20px; padding:7px 14px; cursor:pointer}
.cb.pri{background:var(--red); border-color:var(--red); color:#fff; font-weight:700}
.cb[aria-pressed="true"]{border-color:var(--red); color:var(--red)}
.cb:disabled{opacity:.4; cursor:default}
.hint{font-size:.8rem; color:var(--muted)}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:static}
  .grp{flex-direction:row; flex-wrap:wrap}
  .sc{flex:1 1 200px}
}
@media (max-width:360px){ .phone{width:100%; max-width:300px} .vcard{width:100%; max-width:280px} }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="label">Demo giải pháp chi tiết 1</span><b><em>Visa Accept</em> trong Tendoo</b></div>
    <p class="note">Minh họa theo luồng Visa Accept trong tài liệu của Visa (10/2026). Luồng đăng ký trong Tendoo, gồm bước xác minh hộ kinh doanh, sẽ thống nhất với Visa.</p>
    <div class="grp" id="g"><span class="label">Kịch bản</span></div>
  </aside>
  <main>
    <div class="head">
      <h1 id="title"></h1>
      <p id="persona"></p>
    </div>
    <div class="stage" id="stage"></div>
    <div class="nar" aria-live="polite">
      <div class="nar-top"><span class="label" id="stepNo"></span><div class="bar"><i id="barFill"></i></div></div>
      <p id="say"></p>
      <div class="ctl">
        <button class="cb" id="prev" type="button">← Trước</button>
        <button class="cb pri" id="next" type="button">Tiếp →</button>
        <button class="cb" id="auto" type="button" aria-pressed="false">Tự chạy</button>
        <button class="cb" id="restart" type="button">Làm lại</button>
        <span class="hint">Bấm vào chỗ đang nhấp nháy trên điện thoại, hoặc phím ← →</span>
      </div>
    </div>
  </main>
</div>

<script>
(function(){
/* ---------- Tiện ích dựng giao diện ---------- */
const vnd = n=>n.toLocaleString('vi-VN')+'đ';
const en = n=>n.toLocaleString('en-US')+' VND';
const btn = (t,cls='',next=true)=>`<span class="pb ${cls}"${next?' data-next':''}>${t}</span>`;
const row = (a,b,cls='')=>`<div class="r ${cls}"><span>${a}</span><span>${b}</span></div>`;
const card = (h,cls='')=>`<div class="pc ${cls}">${h}</div>`;
const bar = (t,l='',r='✕')=>`<div class="bar-t"><i>${l}</i><b>${t}</b><i>${r}</i></div>`;
const visaW = (s=14)=>`<span class="vw" style="font-size:${s}px">VISA</span>`;
const by = `<div class="mu" style="text-align:center">Enabled by ${visaW(12)}</div>`;
const tapIc = `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M14 16c3 2.5 3 13.5 0 16"/><path d="M21 11c5 4 5 22 0 26"/><path d="M28 6c7 5.5 7 30.5 0 36"/></svg>`;
function qr(seed){
  let s=seed, out='', N=25;
  const rnd=()=>{s=(s*9301+49297)%233280; return s/233280;};
  const fin=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7" fill="#111"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#111"/>`;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    if((x<8&&y<8)||(x>16&&y<8)||(x<8&&y>16))continue;
    if(rnd()>.52) out+=`<rect x="${x}" y="${y}" width="1" height="1" fill="#111"/>`;
  }
  return `<svg viewBox="0 0 25 25" shape-rendering="crispEdges" aria-label="Mã QR minh họa"><rect width="25" height="25" fill="#fff"/>${out}${fin(0,0)}${fin(18,0)}${fin(0,18)}</svg>`;
}

const LIM = 100000000, CNT = 2000;
/* Bảng điều khiển Visa Accept trong Tendoo: doanh số tháng và hạn mức còn lại */
const dash = (sales, n, acts='', extra='')=>{
  const left = LIM-sales, pct = Math.round(sales/LIM*100);
  return `<div class="tdh"><small>Tendoo · Lan's House</small><b>Visa Accept</b></div>
  <div class="body">
    ${card(`<span class="label" style="color:var(--visa)">Doanh số tháng này</span><div class="big">${vnd(sales)}</div>
      <span class="mu">Hạn mức còn lại</span>
      ${row('<b>'+vnd(left)+'</b>','<span class="mu">/ '+vnd(LIM)+'</span>')}<div class="prog${pct>90?' warn':''}"><i style="width:${pct}%"></i></div>
      ${row('<b>'+(CNT-n).toLocaleString('vi-VN')+' giao dịch</b>','<span class="mu">/ 2.000</span>')}<div class="prog${pct>90?' warn':''}"><i style="width:${n/CNT*100}%"></i></div>
      <span class="mu" style="text-align:right">Đặt lại ngày 01/11</span>`)}
    ${extra}
    ${card('<span class="label">Hoạt động gần đây</span>'+(acts||'<span class="mu">Chưa có giao dịch</span>'),'soft')}
  </div>`;
};
const act = (no,t,how,amt,time)=>`<div class="tx"><div><b>${t}</b><div class="mu">#${no} · ${how} · ${time}</div></div><b>${amt}</b></div>`;

/* Màn hình chờ chạm thẻ (theo Visa: "Tap to pay") */
const tapScr = amt=>`${bar('Chạm để thanh toán','')}
  <div class="center"><div class="big">${vnd(amt)}</div><span class="mu">Đưa thẻ hoặc điện thoại lại gần</span>
  <div class="ring">${tapIc}</div>${visaW(26)}</div>`;

/* ---------- Kịch bản ---------- */
const SC = [];

/* 1. Đăng ký Visa Accept trong Tendoo */
SC.push({ title:'Đăng ký Visa Accept ngay trong Tendoo',
  menu:'① Đăng ký', sub:'Chọn thẻ Visa nhận tiền, đặt tên người bán, đồng ý điều khoản',
  persona:'Chị Lan bán trà và quà lưu niệm ở Hội An, đã dùng Tendoo để bán hàng. Chị bật Visa Accept để nhận thẻ của khách quốc tế, dùng thẻ Visa đang có, không cần máy POS.',
  la:'Điện thoại của chị Lan · Tendoo',
  steps:[
    {say:'Chị Lan mở Tendoo và thấy mục mới: nhận thanh toán thẻ bằng thẻ Visa của chính mình. Không cần thêm thiết bị, tiền về thẻ Visa của chị.',
     a:()=>`<div class="tdh"><small>Xin chào</small><b>Lan's House · Hội An</b></div><div class="body">
       <div class="banner"><b style="font-size:15px">Nhận thanh toán thẻ bằng thẻ Visa của bạn</b>
        <ul><li>Không cần máy POS</li><li>Khách chạm thẻ hoặc trả qua link</li><li>Tiền về thẻ Visa của bạn</li></ul>
        <div style="text-align:right">${btn('Tìm hiểu','white sm')}</div></div>
       <div class="grid"><div><em>Bán</em>Bán hàng</div><div><em>Đơn</em>Đơn hàng</div><div><em>Kho</em>Kho hàng</div><div><em>Sổ</em>Sổ sách</div>
        <div><em>KH</em>Khách hàng</div><div><em>HĐ</em>Hóa đơn</div><div><em>BC</em>Báo cáo</div><div class="new"><em>VA</em>Visa Accept</div></div>
     </div>`},
    {say:'Màn hình giới thiệu: khách trả bằng cách chạm thẻ, ví trên điện thoại, hoặc qua link thanh toán. Mọi giao dịch chạy trên mạng lưới của Visa.',
     a:()=>`${bar('Bắt đầu')}<div class="center" style="padding:0 20px">
       <div style="width:120px;height:120px;border-radius:50%;background:var(--visa-soft);display:grid;place-items:center;color:var(--visa)"><div style="width:60px">${tapIc}</div></div>
       <div class="h">Nhận thanh toán ngay trên điện thoại</div>
       <span class="mu">Khách chạm thẻ, ví trên điện thoại, hoặc trả qua link thanh toán. Mọi giao dịch chạy trên mạng lưới bảo mật của Visa.</span></div>

       ${card(row('Hạn mức tháng','<b>~180.000.000đ</b>')+row('Số giao dịch','<b>Không giới hạn</b>')+row('Mỗi giao dịch','<b>Không giới hạn</b>')+row('Phí (MDR)','<b>Dưới 1%</b>'),'soft')}
       <div class="opt on"><span class="rad"></span><span>Nâng lên gói SMB</span></div>
       <div class="opt"><span class="rad"></span><span>Ở lại Visa Accept, nhận tiếp từ 01/11</span></div></div>
       <div class="foot">${btn('Xem lộ trình')}</div>`},
    {say:'Lộ trình của Visa: bắt đầu với Visa Accept, phí gần như bằng 0; lên gói SMB; rồi nhận thẻ đầy đủ theo biểu phí chuẩn, dùng nhiều loại thiết bị.',
     a:()=>`${bar('Lộ trình nâng gói','←')}<div class="body" style="gap:14px">
       <div class="tier on"><i></i><div><b>Visa Accept</b><span class="mu">Phí gần như bằng 0 · 100 triệu đồng, 2.000 giao dịch mỗi tháng · 8 triệu đồng mỗi giao dịch</span><span><span class="chip v">Đang dùng</span></span></div></div>
       <div class="tier"><i></i><div><b>Gói SMB</b><span class="mu">Phí dưới 1% · ~180 triệu đồng mỗi tháng · không giới hạn số giao dịch và giá trị mỗi giao dịch</span></div></div>
       <div class="tier"><i></i><div><b>Nhận thẻ đầy đủ</b><span class="mu">Biểu phí chuẩn · không giới hạn · nhiều loại thiết bị</span></div></div>
       <div style="flex:1"></div>${by}</div>`}
  ]});

/* ---------- Bộ chạy kịch bản ---------- */
const $ = id=>document.getElementById(id);
let si=0, st=0, timer=null;

function phone(label, inner, blue){
  return `<div class="dev"><span class="label">${label}</span><div class="phone"><div class="scr${blue?' blue':''}">
    <div class="sb"><span>${SC[si].time||'10:05'}</span><span class="cam"></span><span>▴ ▮</span></div>${inner}</div></div></div>`;
}
function vcard(state){
  const tapped = state!=='card', hot = state==='card-hot', done = state==='card-done';
  return `<div class="dev"><span class="label">${SC[si].lb}</span><div class="vcard-wrap">
    <div class="vcard${tapped&&!hot?' tapped':''}"${hot?' data-next role="button" tabindex="0" aria-label="Chạm thẻ"':''}>
      <div class="r"><span class="chipc"></span><span style="font-size:20px">${tapIc.replace('<svg','<svg width="22"')}</span></div>
      <div class="num">4000 •••• •••• 4821</div><div class="r"><span>CAMILLE LAURENT</span><span class="vw">VISA</span></div></div>
    <span class="hint2">${hot?'Bấm vào thẻ để chạm vào điện thoại':done?'✓ Đã chạm thẻ':'Khách chờ trả tiền'}</span></div></div>`;
}
function render(){
  const s=SC[si], p=s.steps[st];
  $('title').textContent=s.title; $('persona').textContent=s.persona;
  let h=phone(s.la, p.a(), p.blue);
  if(p.b) h+= typeof p.b==='string' ? vcard(p.b) : phone(s.lb, p.b(), false);
  $('stage').innerHTML=h;
  $('say').textContent=p.say;
  $('stepNo').textContent=`Bước ${st+1}/${s.steps.length}`;
  $('barFill').style.width=((st+1)/s.steps.length*100)+'%';
  $('prev').disabled = si===0 && st===0;
  $('next').disabled = si===SC.length-1 && st===s.steps.length-1;
  document.querySelectorAll('.sc').forEach((b,i)=>b.setAttribute('aria-current', i===si));
}
function go(d){
  const s=SC[si];
  if(d>0){ if(st<s.steps.length-1) st++; else if(si<SC.length-1){si++; st=0;} else {stopAuto(); return;} }
  else { if(st>0) st--; else if(si>0){si--; st=SC[si].steps.length-1;} }
  render();
}
function stopAuto(){ clearInterval(timer); timer=null; $('auto').setAttribute('aria-pressed','false'); }

const g=$('g');
SC.forEach((s,i)=>{ const b=document.createElement('button'); b.className='sc'; b.type='button';
  b.innerHTML=`<span class="sct">${s.menu}</span><span class="scp">${s.sub}</span>`;
  b.onclick=()=>{si=i; st=0; render();}; g.appendChild(b); });

$('next').onclick=()=>go(1); $('prev').onclick=()=>go(-1);
$('restart').onclick=()=>{st=0; render();};
$('auto').onclick=()=>{ if(timer){stopAuto(); return;} $('auto').setAttribute('aria-pressed','true'); timer=setInterval(()=>go(1),4000); };
$('stage').addEventListener('click',e=>{ if(e.target.closest('[data-next]')) go(1); });
$('stage').addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ')&&e.target.closest('[data-next]')){e.preventDefault(); go(1);} });
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight') go(1); else if(e.key==='ArrowLeft') go(-1); });
render();
})();
</script>
</body>
</html>
