<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Merchant AI Studio Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: danh sách kịch bản bên trái · sân khấu 1–2 điện thoại ở giữa · thanh dẫn chuyện bên dưới */
:root{
  --red:#E1062C; --red-soft:#FDECEF;
  --ink:#1B1517; --muted:#6C6064; --line:#E9E3E5; --bg:#FFFFFF; --surface:#F7F4F5;
  --font:"Be Vietnam Pro","Segoe UI",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  /* Màn hình điện thoại luôn sáng như app thật */
  --p-bg:#FFFFFF; --p-chat:#F3F4F7; --p-ink:#1B1517; --p-muted:#6B6670; --p-line:#E6E3E8; --p-bubble:#FFFFFF;
  --tammi:#1F6FEB; --tendoo:#E1062C; --web:#0F8A6C; --ok:#138A4E; --warn:#B45309; --device:#17121A;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --red:#FF4D68; --red-soft:#3A1219; --ink:#F4EFF1; --muted:#AA9DA2; --line:#352B2F; --bg:#141012; --surface:#1D181A; --device:#3B3238; color-scheme:dark; }
}
:root[data-theme="dark"]{ --red:#FF4D68; --red-soft:#3A1219; --ink:#F4EFF1; --muted:#AA9DA2; --line:#352B2F; --bg:#141012; --surface:#1D181A; --device:#3B3238; color-scheme:dark; }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); font-size:15px; line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px))}
button{font:inherit}
:focus-visible{outline:2px solid var(--red); outline-offset:2px}
.label{font-family:var(--mono); font-size:.7rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}

.app{max-width:1360px; margin:0 auto; display:grid; grid-template-columns:270px minmax(0,1fr); gap:32px; padding-block:24px}
.side{position:sticky; top:calc(16px + env(safe-area-inset-top, 0px)); align-self:start; display:flex; flex-direction:column; gap:18px}
.brand{display:flex; flex-direction:column; gap:2px}
.brand b{font-size:1.15rem; font-weight:800}
.brand b em{font-style:normal; color:var(--red)}
.grp{display:flex; flex-direction:column; gap:6px}
.sc{all:unset; cursor:pointer; display:flex; flex-direction:column; gap:3px; padding:10px 12px; border-radius:10px; border:1px solid transparent}
.sc:hover{background:var(--surface)}
.sc[aria-current="true"]{background:var(--surface); border-color:var(--line)}
.sc[aria-current="true"] .sct{color:var(--red)}
.sc:focus-visible{outline:2px solid var(--red)}
.sct{font-weight:700; font-size:.92rem; line-height:1.3}
.scp{font-size:.78rem; color:var(--muted); line-height:1.35}
.back{font-size:.82rem; color:var(--muted)}
.back a{color:var(--red)}

main{min-width:0; display:flex; flex-direction:column; gap:20px}
.head{display:flex; flex-direction:column; gap:6px}
.head h1{margin:0; font-size:1.6rem; font-weight:800; line-height:1.2; text-wrap:balance}
.head p{margin:0; color:var(--muted); max-width:70ch}
.tags{display:flex; flex-wrap:wrap; gap:6px}
.tag{font-size:.72rem; font-weight:600; padding:3px 9px; border-radius:999px; background:var(--red-soft); color:var(--red)}
.tag.n{background:var(--surface); color:var(--muted)}

.stage{display:flex; flex-wrap:wrap; justify-content:center; gap:28px; padding:8px 0}
.ph{display:flex; flex-direction:column; align-items:center; gap:10px}
.cap{font-size:.82rem; font-weight:600; color:var(--muted); text-align:center}

.nar{position:sticky; bottom:calc(12px + env(safe-area-inset-bottom, 0px)); background:var(--bg); border:1px solid var(--line); border-radius:14px; padding:14px 16px; display:flex; flex-direction:column; gap:10px; box-shadow:0 8px 28px rgba(0,0,0,.08); max-width:860px; width:100%; align-self:center}
.nar-top{display:flex; align-items:center; gap:12px}
.bar{flex:1; height:4px; border-radius:4px; background:var(--line); overflow:hidden}
.bar i{display:block; height:100%; background:var(--red); transition:width .3s}
#say{margin:0; font-size:.98rem; min-height:3em}
.ctl{display:flex; flex-wrap:wrap; gap:8px}
.cb{border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:999px; padding:7px 16px; cursor:pointer; font-weight:600; font-size:.85rem}
.cb.pri{background:var(--red); border-color:var(--red); color:#fff}
.cb:disabled{opacity:.4; cursor:default}
.hint{font-size:.75rem; color:var(--muted); margin-left:auto; align-self:center}

/* ===== Điện thoại ===== */
.dev{width:300px; height:620px; border-radius:42px; border:10px solid var(--device); background:var(--p-bg); position:relative; overflow:hidden; display:flex; flex-direction:column; color:var(--p-ink); font-size:12.5px; line-height:1.45; box-shadow:0 16px 40px rgba(0,0,0,.18)}
.dev::before{content:""; position:absolute; top:8px; left:50%; transform:translateX(-50%); width:84px; height:22px; border-radius:12px; background:var(--device); z-index:5}
.sb{display:flex; justify-content:space-between; padding:11px 22px 4px; font-size:11px; font-weight:600; font-variant-numeric:tabular-nums}
.ah{display:flex; align-items:center; gap:9px; padding:8px 12px 10px; border-bottom:1px solid var(--p-line)}
.ah .lg{width:30px; height:30px; border-radius:50%; display:grid; place-items:center; color:#fff; font-weight:800; font-size:12px; flex:none}
.ah .tt{display:flex; flex-direction:column; min-width:0}
.ah .tt b{font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ah .tt small{font-size:10.5px; color:var(--p-muted)}
.k-tammi .lg{background:var(--tammi)} .k-tendoo .lg{background:var(--tendoo)} .k-web .lg{background:var(--web)} .k-live .lg{background:var(--tendoo)}
.k-tendoo .ah{background:var(--tendoo); color:#fff; border-color:transparent} .k-tendoo .ah .lg{background:#fff; color:var(--tendoo)} .k-tendoo .ah .tt small{color:rgba(255,255,255,.85)}
.k-web .urlbar{margin:0 10px 8px; padding:6px 10px; border-radius:9px; background:#EEF1F0; font-size:10.5px; color:var(--p-muted); display:flex; gap:6px}
.body{flex:1; overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:8px; background:var(--p-chat); scroll-behavior:smooth}
.body > *{flex:none}
.k-live .body{background:linear-gradient(180deg,#3a2a24 0%,#1d1513 55%,#120d0c 100%); padding:10px 10px 12px; justify-content:flex-end}
.inp{display:flex; align-items:center; gap:8px; padding:8px 10px 14px; border-top:1px solid var(--p-line); background:var(--p-bg)}
.inp span{flex:1; background:var(--p-chat); border-radius:18px; padding:7px 12px; color:var(--p-muted); font-size:11.5px}
.inp i{width:28px; height:28px; border-radius:50%; background:var(--tammi); flex:none}
.k-web .inp i{background:var(--web)}

.m{max-width:84%; padding:7px 10px; border-radius:14px; background:var(--p-bubble); border:1px solid var(--p-line); align-self:flex-start; word-wrap:break-word}
.m .who{display:block; font-size:10px; font-weight:700; color:var(--p-muted); margin-bottom:2px}
.m.me{align-self:flex-end; background:var(--tammi); border-color:var(--tammi); color:#fff}
.k-web .m.me{background:var(--web); border-color:var(--web)}
.m.bot .who{color:var(--tammi)}
.m.bot.shop .who{color:var(--tendoo)}
.m.wide{max-width:94%}
.m .tr{display:block; margin-top:4px; padding-top:4px; border-top:1px dashed var(--p-line); font-size:10.5px; color:var(--p-muted)}
.m.me .tr{border-color:rgba(255,255,255,.4); color:rgba(255,255,255,.85)}
.sys{align-self:center; font-size:10.5px; color:var(--p-muted); background:rgba(0,0,0,.05); padding:3px 10px; border-radius:999px; text-align:center; max-width:92%}
.pc{background:var(--p-bg); border:1px solid var(--p-line); border-radius:12px; padding:9px 10px; display:flex; flex-direction:column; gap:5px; align-self:stretch}
.pc.hl{border-color:var(--tammi); box-shadow:0 0 0 2px rgba(31,111,235,.12)}
.pc.ok{border-color:var(--ok)}
.pc.red{border-color:var(--tendoo)}
.pc h5{margin:0; font-size:12.5px}
.pc .mu{color:var(--p-muted); font-size:11px}
.r{display:flex; justify-content:space-between; gap:8px; font-variant-numeric:tabular-nums}
.r.tot{font-weight:800; border-top:1px solid var(--p-line); padding-top:5px}
.r .mu{font-size:11px}
.pb{display:block; text-align:center; font-weight:700; font-size:11.5px; padding:8px; border-radius:10px; background:var(--tammi); color:#fff; cursor:default}
.pb.red{background:var(--tendoo)} .pb.green{background:var(--web)} .pb.ghost{background:transparent; color:var(--p-ink); border:1px solid var(--p-line)}
.pbs{display:flex; gap:6px} .pbs .pb{flex:1}
[data-next]{cursor:pointer; animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(31,111,235,.45)}50%{box-shadow:0 0 0 6px rgba(31,111,235,0)}}
.shop{display:flex; gap:9px; align-items:center}
.shop .th{width:46px; height:46px; border-radius:10px; flex:none; display:grid; place-items:center; color:#fff; font-weight:800; font-size:15px}
.shop .in{flex:1; min-width:0; display:flex; flex-direction:column; gap:1px}
.chip{display:inline-block; font-size:10px; font-weight:700; padding:1px 7px; border-radius:999px; background:#E9F7EF; color:var(--ok)}
.chip.w{background:#FFF3E0; color:var(--warn)} .chip.b{background:#E8F0FE; color:var(--tammi)} .chip.g{background:#EEF0F2; color:var(--p-muted)}
.chips{display:flex; flex-wrap:wrap; gap:4px}
.av{display:inline-grid; place-items:center; width:18px; height:18px; border-radius:50%; color:#fff; font-size:9px; font-weight:800; flex:none}
.mi{display:flex; flex-direction:column; gap:3px; padding:6px 0; border-bottom:1px dashed var(--p-line)}
.mi:last-child{border-bottom:0}
.mi .pk{display:flex; flex-wrap:wrap; gap:4px; align-items:center; min-height:18px}
.mi .pk small{font-size:10px; color:var(--p-muted)}
.steps{display:flex; flex-direction:column; gap:5px}
.st{display:flex; gap:8px; align-items:center; font-size:11.5px; color:var(--p-muted)}
.st i{width:14px; height:14px; border-radius:50%; border:2px solid var(--p-line); flex:none}
.st.done{color:var(--p-ink)} .st.done i{background:var(--ok); border-color:var(--ok)}
.st.now{color:var(--p-ink); font-weight:700} .st.now i{border-color:var(--tammi); background:#fff; box-shadow:inset 0 0 0 3px var(--tammi)}
.qr{display:flex; gap:10px; align-items:center}
.qr svg{width:96px; height:96px; flex:none; background:#fff; border:1px solid var(--p-line); border-radius:8px; padding:4px}
.pay .opt{display:flex; justify-content:space-between; align-items:center; padding:7px 9px; border:1px solid var(--p-line); border-radius:9px; font-size:11.5px}
.pay .opt.on{border-color:var(--tammi); background:#F2F7FF}
.pay .opt b{font-size:11px}
.kp{display:grid; grid-template-columns:1fr 1fr; gap:6px}
.kp div{background:var(--p-chat); border-radius:9px; padding:7px 9px; font-size:10.5px; color:var(--p-muted)}
.kp b{display:block; font-size:16px; color:var(--p-ink); font-variant-numeric:tabular-nums}
.standee{align-self:center; margin-top:30px; width:200px; padding:16px; border-radius:16px; background:#fff; border:2px solid var(--p-ink); text-align:center; display:flex; flex-direction:column; gap:8px; align-items:center}
.standee svg{width:110px; height:110px}
.standee b{font-size:12px}
.standee small{font-size:10.5px; color:var(--p-muted)}
.fr{font-size:11px}

/* Live */
.livetop{position:relative; height:150px; background:linear-gradient(135deg,#5b3b2c,#1f1512); color:#fff; display:flex; flex-direction:column; justify-content:space-between; padding:8px 10px}
.livetop .lb{align-self:flex-start; background:var(--tendoo); font-size:9.5px; font-weight:800; padding:2px 7px; border-radius:4px}
.livetop .host{position:absolute; right:16px; top:24px; width:70px; height:70px; border-radius:50%; background:radial-gradient(circle at 50% 38%, #e7c2a6 0 30%, #7b4e3a 31% 100%); opacity:.9}
.livetop .pin{background:rgba(255,255,255,.95); color:var(--p-ink); border-radius:9px; padding:6px 8px; font-size:11px; display:flex; justify-content:space-between; gap:6px}
.cm{color:#fff; font-size:11.5px; line-height:1.35; text-shadow:0 1px 2px rgba(0,0,0,.6); max-width:94%}
.cm b{color:#FFC2CE}
.cm.ai{background:rgba(31,111,235,.85); border-radius:8px; padding:4px 7px; text-shadow:none}
.cm.pinm{background:rgba(255,255,255,.95); color:var(--p-ink); text-shadow:none; border-radius:8px; padding:5px 8px}
.cm.pinm b{color:var(--tendoo)}
.hostbg{position:absolute; inset:0; background:radial-gradient(circle at 70% 22%, #e7c2a6 0 9%, transparent 9.5%), radial-gradient(ellipse at 70% 45%, #7b4e3a 0 22%, transparent 22.5%); opacity:.55; pointer-events:none}
.k-live .ah{background:#120d0c; color:#fff; border-color:#2a201d}
.k-live .ah .tt small{color:rgba(255,255,255,.7)}
.dock{background:var(--p-bg); border-top:1px solid var(--p-line); padding:10px; display:flex; flex-direction:column; gap:6px; max-height:290px; overflow-y:auto}
.dock h6{margin:0; font-size:11px; color:var(--p-muted); text-transform:uppercase; letter-spacing:.06em}
.cl{display:flex; flex-direction:column; gap:4px; border:1px solid var(--p-line); border-radius:10px; padding:7px 9px}
.cl .r b{font-size:12px}
.cl .cnt{font-weight:800; color:var(--tendoo); font-variant-numeric:tabular-nums}
.cl.done{opacity:.6}
.cl.open{border-color:var(--tendoo)}
.cl q{display:block; font-size:10.5px; color:var(--p-muted); quotes:none}
.sugg{background:#FFF7E8; border-radius:8px; padding:6px 8px; font-size:11px}

/* Bảng trượt */
.sheet-bg{position:absolute; inset:0; background:rgba(0,0,0,.35); display:flex; align-items:flex-end; z-index:4}
.sheet{width:100%; background:var(--p-bg); border-radius:18px 18px 0 0; padding:14px 14px 22px; display:flex; flex-direction:column; gap:8px; animation:up .3s ease}
.sheet .grab{width:36px; height:4px; border-radius:4px; background:var(--p-line); align-self:center}
.tap{display:grid; place-items:center; gap:10px; padding:14px 0; text-align:center}
.tap .ring{width:120px; height:120px; border-radius:50%; border:4px solid var(--web); display:grid; place-items:center; color:var(--web); font-weight:800; box-shadow:0 0 0 12px rgba(15,138,108,.12)}
@keyframes up{from{transform:translateY(40px); opacity:0}to{transform:none; opacity:1}}
.new{animation:pop .35s ease}
@keyframes pop{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
@media (prefers-reduced-motion: reduce){.new,.sheet{animation:none} [data-next]{animation:none} .body{scroll-behavior:auto}}

@media (max-width:1000px){
  .app{grid-template-columns:minmax(0,1fr); gap:16px; padding-block:12px}
  .side{position:static}
  .grp{flex-direction:row; overflow-x:auto; padding-bottom:4px}
  .sc{min-width:200px}
}
@media (max-width:360px){ .dev{width:280px} }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="label">Demo trải nghiệm</span><b>Merchant <em>AI</em> Studio</b><span class="back">Đi kèm <a href="../03_proposal/merchant-studio-proposal.html">proposal</a> · kịch bản minh hoạ</span></div>
    <div class="grp" id="g-m"><span class="label">Người bán</span></div>
    <div class="grp" id="g-u"><span class="label">Người dùng Tammi</span></div>
  </aside>
  <main>
    <div class="head">
      <div class="tags" id="tags"></div>
      <h1 id="title"></h1>
      <p id="persona"></p>
    </div>
    <div class="stage" id="stage"></div>
    <div class="nar" aria-live="polite">
      <div class="nar-top"><span class="label" id="stepNo"></span><div class="bar"><i id="barFill"></i></div></div>
      <p id="say"></p>
      <div class="ctl">
        <button class="cb" id="prev" type="button">← Trước</button>
        <button class="cb pri" id="next" type="button">Tiếp →</button>
        <button class="cb" id="auto" type="button" aria-pressed="false">Tự chạy</button>
        <button class="cb" id="restart" type="button">Làm lại</button>
        <span class="hint">Bấm nút đang nhấp nháy trên điện thoại, hoặc phím ← →</span>
      </div>
    </div>
  </main>
</div>

<script>
(function(){
/* ---------- Tiện ích dựng giao diện ---------- */
const C = {Lan:'#D9480F', Hung:'#2F9E44', Mai:'#AE3EC9', Tuan:'#1971C2', Hoa:'#E67700', Minh:'#1F6FEB'};
const av = (n,c)=>`<span class="av" style="background:${c}">${n[0]}</span>`;
const bot = (who,t,cls='')=>`<div class="m bot ${cls}"><span class="who">${who}</span>${t}</div>`;
const me = (t,cls='')=>`<div class="m me ${cls}">${t}</div>`;
const oth = (n,c,t)=>`<div class="m"><span class="who" style="color:${c}">${n}</span>${t}</div>`;
const sys = t=>`<div class="sys">${t}</div>`;
const btn = (t,cls='',next=true)=>`<span class="pb ${cls}"${next?' data-next':''}>${t}</span>`;
const row = (a,b,cls='')=>`<div class="r ${cls}"><span>${a}</span><span>${b}</span></div>`;
const card = (h,cls='')=>`<div class="pc ${cls}">${h}</div>`;
const tr = t=>`<span class="tr">${t}</span>`;
const steps = (labels,n)=>`<div class="steps">${labels.map((l,i)=>`<div class="st ${i<n?'done':i===n?'now':''}"><i></i>${l}</div>`).join('')}</div>`;
function qr(seed){
  let s=seed, out='', N=25;
  const rnd=()=>{s=(s*9301+49297)%233280; return s/233280;};
  const fin=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7" fill="#111"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#111"/>`;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    if((x<8&&y<8)||(x>16&&y<8)||(x<8&&y>16))continue;
    if(rnd()>.52) out+=`<rect x="${x}" y="${y}" width="1" height="1" fill="#111"/>`;
  }
  return `<svg viewBox="0 0 25 25" shape-rendering="crispEdges" aria-label="Mã QR minh hoạ"><rect width="25" height="25" fill="#fff"/>${out}${fin(0,0)}${fin(18,0)}${fin(0,18)}</svg>`;
}
const paySheet = (amt, sel=0, title='Thanh toán qua VDF')=>`<div class="grab"></div><b>${title}</b><div style="font-size:22px;font-weight:800">${amt}</div>
  <div class="pay" style="display:flex;flex-direction:column;gap:6px">
   <div class="opt ${sel===0?'on':''}"><span>Viettel Money</span><b>${sel===0?'●':'○'}</b></div>
   <div class="opt ${sel===1?'on':''}"><span>Tài khoản ngân hàng liên kết</span><b>${sel===1?'●':'○'}</b></div>
   <div class="opt ${sel===2?'on':''}"><span>Thẻ nội địa / quốc tế</span><b>${sel===2?'●':'○'}</b></div>
  </div>${btn('Xác thực vân tay & thanh toán')}`;
const tapSheet = (amt,who)=>`<div class="grab"></div><b>Nhận thanh toán chạm</b><div class="tap"><div class="ring">CHẠM</div><div style="font-size:20px;font-weight:800">${amt}</div><span class="mu" style="color:var(--p-muted)">Đưa máy cho ${who}: chạm thẻ Visa, Mastercard… hoặc điện thoại</span></div>`;

/* ---------- Kịch bản ---------- */
const SC = [];

/* 1. Livestream – khách chat, lên đơn, thanh toán */
SC.push({ id:'live-chat', g:'m', title:'Trợ lý Livestream: tư vấn và lên đơn trong chat',
  menu:'① Livestream · Khách nhắn riêng khi xem live',
  persona:'Chị Lan (chủ Lan\'s House) đang livestream trên Tammi. Chị Hà xem live và nhắn riêng cho shop. Trợ lý tư vấn, lên đơn; chị Hà xác nhận, thanh toán và chờ giao hàng. Chị Lan không phải dừng live để ghi đơn.',

/* 2. Livestream – gom câu hỏi */
const comments = [['Hà','trà sen pha sao vậy shop'],['Tú','ship Đà Nẵng mấy ngày ạ'],['Ngọc','pha mấy độ thì ngon?'],['Long','có hộp quà không c'],['Vy','trà này pha sao ạ'],['Quân','ship ra ĐN bao lâu'],['Thảo','hạn dùng bao lâu shop'],['Bình','cách pha trà sen??'],['An','có hộp quà tặng sếp ko'],['Hiếu','pha được mấy nước'],['My','ship đi Đà Nẵng được k'],['Khoa','ủ bao nhiêu phút ạ']];
const clusters = (state)=>{
  const L=[['Cách pha trà sen?',14,'“trà sen pha sao vậy shop” · “pha mấy độ thì ngon?” · “ủ bao nhiêu phút ạ”'],['Giao đi Đà Nẵng mấy ngày?',9,'“ship Đà Nẵng mấy ngày ạ” · “ship ra ĐN bao lâu”'],['Có hộp quà tặng không?',6,'“có hộp quà không c” · “có hộp quà tặng sếp ko”'],['Hạn dùng bao lâu?',4,'“hạn dùng bao lâu shop”']];
  return '<h6>Trợ lý gom câu hỏi · 2 phút qua</h6>'+L.map((c,i)=>{
    const done = state.done && state.done.includes(i), open = state.open===i;
    let h=`<div class="cl ${done?'done':''} ${open?'open':''}"><div class="r"><b>${c[0]}</b><span class="cnt">${done?'✓':c[1]+' người'}</span></div><q>${c[2]}</q>`;
    if(open) h+=`<div class="sugg"><b>Gợi ý từ thông tin sản phẩm:</b> 1 túi 5g · nước 85–90°C · ủ 3 phút · pha được 3–4 nước</div>${btn('Tôi đã trả lời trên live','red')}`;
    else if(i===0 && state.cta && !done) h+=btn('Xem & trả lời','red');
    if(done && i>0 && state.auto) h+=`<span class="mu">Trợ lý đã tự trả lời dưới comment</span>`;
    return h+'</div>';
  }).join('')+(state.summary?`<div class="kp"><div>Trợ lý tự trả lời<b>23 câu</b></div><div>Chờ chị trả lời<b>1 nhóm</b></div></div>`:'');
};

/* ---------- Bộ máy chạy kịch bản ---------- */
const $=s=>document.querySelector(s);
let sc=0, i=0, timer=null, cur=0, st=null;
const API = {
  add:(p,h,k)=>st[p].items.push({k:k||('_'+st[p].items.length+'_'+cur),h,s:cur}),
  up:(p,k,h)=>{const it=st[p].items.find(x=>x.k===k); if(it){it.h=h; it.s=cur;} else st[p].items.push({k,h,s:cur});},
  set:(p,o)=>Object.assign(st[p],o),
  clear:p=>{st[p].items=[]},
  sheet:(p,h)=>{st[p].sheet=h; st[p].sheetS=cur;},
  show:p=>{st[p].hidden=false}
};
function build(){
  const S=SC[sc];
  st={}; for(const k in S.phones){ st[k]=Object.assign({items:[],input:true,sheet:null,dock:'',top:'',url:''},JSON.parse(JSON.stringify(S.phones[k]))); }
  for(cur=0; cur<=i; cur++){ S.steps[cur].do(API); }
}
const strip=h=>h.replace(/ data-next/g,'');
function phone(k){
  const p=st[k]; if(p.hidden) return '';
  const lg={tammi:'t',tendoo:'T',web:'AI',live:'LH'}[p.kind]||'';
  const items=p.items.map(it=>{let h=it.s<i?strip(it.h):it.h; return it.s===i?h.replace(/^<(\w+) class="/,'<$1 class="new '):h;}).join('');
  return `<div class="ph"><div class="dev k-${p.kind}">
    <div class="sb"><span>${p.time}</span><span>${p.net||'5G'} ▮▮▮</span></div>
    <div class="ah"><span class="lg">${lg}</span><div class="tt"><b>${p.title}</b><small>${p.sub||''}</small></div></div>
    ${p.url?`<div class="urlbar">🔒 ${p.url}</div>`:''}
    ${p.top||''}
    <div class="body" data-p="${k}">${p.bg?'<div class="hostbg"></div>':''}${items}</div>
    ${p.dock?`<div class="dock">${p.dock}</div>`:''}
    ${p.input?`<div class="inp"><span>${p.kind==='web'?'Message…':'Nhắn tin…'}</span><i></i></div>`:''}
    ${p.sheet?`<div class="sheet-bg"><div class="sheet">${p.sheetS<i?strip(p.sheet):p.sheet}</div></div>`:''}
  </div><div class="cap">${p.label}</div></div>`;
}
function render(){
  const S=SC[sc];
  build();
  $('#title').textContent=S.title; $('#persona').textContent=S.persona;
  $('#tags').innerHTML=S.tags.map(t=>`<span class="tag">${t}</span>`).join('');
  $('#stage').innerHTML=Object.keys(st).map(phone).join('');
  $('#say').textContent=S.steps[i].say;
  $('#stepNo').textContent=`Bước ${i+1}/${S.steps.length}`;
  $('#barFill').style.width=((i+1)/S.steps.length*100)+'%';
  $('#prev').disabled=i===0; $('#next').disabled=i===S.steps.length-1;
  document.querySelectorAll('.body').forEach(b=>{b.scrollTop=b.scrollHeight;});
  document.querySelectorAll('.sc').forEach((b,n)=>b.setAttribute('aria-current',String(n===sc)));
}
function go(n){ const L=SC[sc].steps.length; i=Math.max(0,Math.min(L-1,n)); render(); if(i===L-1) stopAuto(); }
function pick(n){ sc=n; i=0; stopAuto(); render(); try{ history.replaceState(null,'','#'+SC[n].id);}catch(e){} window.scrollTo({top:0}); }
function stopAuto(){ if(timer){clearInterval(timer); timer=null;} $('#auto').setAttribute('aria-pressed','false'); $('#auto').textContent='Tự chạy'; }
// Danh sách kịch bản
SC.forEach((S,n)=>{ const b=document.createElement('button'); b.className='sc'; b.type='button';
  b.innerHTML=`<span class="sct">${S.menu}</span><span class="scp">${S.steps.length} bước</span>`; b.addEventListener('click',()=>pick(n));
  $(S.g==='m'?'#g-m':'#g-u').appendChild(b); });
$('#prev').addEventListener('click',()=>go(i-1));
$('#next').addEventListener('click',()=>go(i+1));
$('#restart').addEventListener('click',()=>{stopAuto(); go(0);});
$('#auto').addEventListener('click',()=>{ if(timer){stopAuto(); return;} if(i===SC[sc].steps.length-1) go(0);
  $('#auto').setAttribute('aria-pressed','true'); $('#auto').textContent='Dừng'; timer=setInterval(()=>go(i+1),3800); });
$('#stage').addEventListener('click',e=>{ if(e.target.closest('[data-next]')) go(i+1); });
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight') go(i+1); if(e.key==='ArrowLeft') go(i-1); });
const h=(location.hash||'').slice(1); const start=SC.findIndex(s=>s.id===h);
sc = start>=0?start:0; render();
})();
</script>
